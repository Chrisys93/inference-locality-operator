# Lets the EPP (service account router-epp) read the one ConfigMap holding the bucket map.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-epp-bucket-map
  namespace: ilo-sim
rules:
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [sim-pool-bucket-map]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-epp-bucket-map
  namespace: ilo-sim
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-epp-bucket-map
subjects:
- kind: ServiceAccount
  name: router-epp
  namespace: ilo-sim
