# Two llm-d-inference-sim replicas standing in for vLLM (no GPU, no model).
# Latencies are configured here, not computed: runs on these pods check that routing works and how requests and
# prefixes are spread; they give no performance figures.
apiVersion: v1
kind: Namespace
metadata:
  name: ilo-sim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim
  namespace: ilo-sim
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sim-pool
  template:
    metadata:
      labels:
        app: sim-pool
    spec:
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.2.0
          imagePullPolicy: IfNotPresent
          args:
            - --model=sim-model          # no "/": the simulator's own tokenizer, no render service
            - --port=8000
            - --mode=random
            - --max-model-len=4096
            - --max-num-seqs=4           # as the vLLM settings for the 12 GB card in code-doc-assistant
            - --enable-kvcache
            - --block-size=16
            - --kv-cache-size=512        # 8,192 tokens: smaller than the working set, so placement decides hits
            - --latency-calculator=per-token
            - --prefill-overhead=10ms
            - --prefill-time-per-token=1ms   # only uncached tokens count, so a cache hit shortens the first token
            - --inter-token-latency=10ms
            - --time-factor-under-load=1.5
          env:
            - name: POD_NAME             # returned as the x-inference-pod response header
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 2
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
# R0: a plain Service in front of the same pods (kube-proxy picks a pod at random).
apiVersion: v1
kind: Service
metadata:
  name: sim-plain
  namespace: ilo-sim
spec:
  selector: { app: sim-pool }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
# Headless: the load generator resolves every pod's address to read its /metrics.
apiVersion: v1
kind: Service
metadata:
  name: sim-direct
  namespace: ilo-sim
spec:
  clusterIP: None
  selector: { app: sim-pool }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
