# This rule is not used by the project inference-locality-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the routing.chrisys93.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: inference-locality-operator
    app.kubernetes.io/managed-by: kustomize
  name: prefixaffinitypolicy-editor-role
rules:
- apiGroups:
  - routing.chrisys93.github.io
  resources:
  - prefixaffinitypolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - routing.chrisys93.github.io
  resources:
  - prefixaffinitypolicies/status
  verbs:
  - get
