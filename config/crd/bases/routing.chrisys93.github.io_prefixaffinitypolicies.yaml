                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastRebalanceTime:
                description: lastRebalanceTime is when buckets last moved because
                  of the trigger.
                format: date-time
                type: string
              mapVersion:
                description: mapVersion increases every time the map changes.
                format: int64
                type: integer
              observedGeneration:
                description: observedGeneration is the generation of the spec last
                  acted on.
                format: int64
                type: integer
              replicas:
                description: replicas as seen in the last interval.
                items:
                  description: ReplicaStatus is what the controller saw of one replica
                    in the last interval.
                  properties:
                    buckets:
                      description: buckets owned.
                      format: int32
                      type: integer
                    kvCacheUsagePercent:
                      description: kvCacheUsagePercent at the last read.
                      format: int32
                      type: integer
                    meanQueueMillis:
                      description: meanQueueMillis is the mean queueing delay per
                        completed request in the last interval.
                      format: int64
                      type: integer
                    meanServiceMillis:
                      description: meanServiceMillis is the mean inference (service)
                        time per completed request in the last interval.
                      format: int64
                      type: integer
                    name:
                      description: name of the pod.
                      type: string
                    overloaded:
                      description: overloaded is true when the trigger fired for this
                        replica in the last interval.
                      type: boolean
                    requests:
                      description: requests completed in the last interval.
                      format: int64
                      type: integer
                    scrapeError:
                      description: scrapeError is set when the metrics could not be
