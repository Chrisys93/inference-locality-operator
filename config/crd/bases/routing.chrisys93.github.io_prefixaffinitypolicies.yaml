              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PrefixAffinityPolicy
            properties:
              buckets:
                default: 64
                description: buckets is the number of prefix-hash buckets shared out
                  among the replicas.
                format: int32
                maximum: 4096
                minimum: 1
                type: integer
              metricsPath:
                default: /metrics
                description: metricsPath is the path of the metrics endpoint.
                type: string
              metricsPort:
                default: 8000
                description: metricsPort is the port serving Prometheus metrics on
                  each model-server pod.
                format: int32
                type: integer
              prefix:
                description: PrefixSpec defines the part of the prompt that names
                  a bucket.
                properties:
                  bytes:
                    default: 2048
                    description: |-
                      bytes is the number of leading bytes of the prompt (UTF-8) hashed into the bucket key. The scorer reads the
                      value from the published bucket map, so both use the same.
                    format: int32
                    minimum: 16
                    type: integer
                type: object
              rebalance:
                description: RebalanceSpec bounds how buckets move.
                properties:
                  cooldown:
                    default: 2m
                    description: cooldown is the time a moved bucket stays with its
                      new owner before it can move again.
                    type: string
                  interval:
                    default: 30s
                    description: interval between metric reads and rebalancing decisions.
                    type: string
                  maxMovesPerInterval:
