                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              trigger:
                description: TriggerSpec defines when a replica counts as overloaded.
                properties:
                  kvCacheUsagePercent:
                    default: 90
                    description: 'kvCacheUsagePercent: KVCacheUsage fires when the
                      replica reports a KV-cache use above this percentage.'
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  minRequests:
                    default: 20
                    description: |-
                      minRequests is the number of requests a replica must have completed in the interval for its QueueDelay
                      figures to count; below it the replica is not judged.
                    format: int32
                    minimum: 1
                    type: integer
                  queueDelayPercent:
                    default: 200
                    description: |-
                      queueDelayPercent: QueueDelay fires when mean queueing delay > queueDelayPercent/100 x mean service time
                      over the last interval. 200 is the "twice the service time" trigger.
                    format: int32
                    minimum: 1
                    type: integer
                  type:
                    default: QueueDelay
                    description: type of the trigger.
